<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dungeon Run's home-screen icon: the sorcerer in torchlight. Colors are the palette in data/config.json.
       The PNGs beside it are rendered from this file (iPadOS won't use an SVG on the home screen). -->
  <defs>
    <radialGradient id="light" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#e8a33d" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#e8a33d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0d0b0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="book" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2521"/>
      <stop offset="1" stop-color="#0d0b0a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#stone)"/>
  <rect width="512" height="512" fill="url(#light)"/>
  <path d="M0 420 L512 420" stroke="#0d0b0a" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="340" r="120" fill="url(#book)"/>
