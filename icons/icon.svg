    <circle cx="44.5" cy="44" r="2.6" fill="#e8a33d"/>
    <circle cx="55.5" cy="44" r="2.6" fill="#e8a33d"/>
    <path d="M33 80 L50 85 L67 80 L67 100 L50 105 L33 100 Z" fill="#080706" stroke="#8b5cf6" stroke-width="2" stroke-linejoin="round"/>
    <path d="M50 85 L50 105" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M41 88 L41 97 M59 88 L59 97" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
    <path d="M22 76 C27 86 33 92 36 94 L34 102 C27 98 20 90 17 82 Z M78 76 C73 86 67 92 64 94 L66 102 C73 98 80 90 83 82 Z" fill="#72667a"/>
