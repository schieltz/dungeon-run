  <script>
    // If the game code can't load at all, say why instead of showing a blank screen.
    function bootFailed() {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var help = location.protocol === 'file:'
        ? 'Browsers refuse to run this game straight from a file.\nServe the folder instead. In a terminal, inside the DungeonRun folder:\n\n  python3 -m http.server 8000\n\nthen open http://localhost:8000'
        : 'The game code failed to load. Try reloading the page.';
      boot.innerHTML = '<div><h1>The torches won’t light.</h1><pre></pre></div>';
      boot.querySelector('pre').textContent = help;
    }
  </script>
  <script type="module" src="src/main.js" onerror="bootFailed()"></script>
